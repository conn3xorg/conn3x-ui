#
# Releases are cut by .github/workflows/release.yml, which runs this as a
# draft that a maintainer reviews and publishes. Try it locally with
#   goreleaser release --snapshot --clean --skip=publish,sign,sbom
version: 2
project_name: conn3x-ui

builds:
  - id: conn3x-ui
    main: .
    binary: conn3x-ui
    # modernc.org/sqlite is pure Go, so every target builds without cgo.
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

nfpms:
  - id: packages
    ids: [conn3x-ui]
    package_name: conn3x-ui
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: The Conn3x Authors
    homepage: https://conn3x.org
    maintainer: The Conn3x Authors <security@conn3x.org>
    description: A web UI for Conn3x. Plan from the browser, apply exactly that plan.
    license: MPL-2.0
    formats: [deb, rpm]
    bindir: /usr/bin
    mtime: "{{ .CommitDate }}"
    # The binary only. How it runs, as which user and with which key, is
    # the circuit's to set up (conn3xorg/circuit-conn3x-ui), or yours.
    contents:
      - src: LICENSE
        dst: /usr/share/doc/conn3x-ui/LICENSE
        file_info: { mode: 0644, mtime: "{{ .CommitDate }}" }
      - src: README.md
        dst: /usr/share/doc/conn3x-ui/README.md
        file_info: { mode: 0644, mtime: "{{ .CommitDate }}" }
      - src: LICENSE
        dst: /usr/share/doc/conn3x-ui/copyright
        packager: deb
        file_info: { mode: 0644, mtime: "{{ .CommitDate }}" }
    # Signed with the same packages key as conn3x's, which its apt and dnf
    # repositories check.
    deb:
      signature:
        key_file: '{{ envOrDefault "PACKAGES_GPG_KEY_FILE" "" }}'
    rpm:
      signature:
        key_file: '{{ envOrDefault "PACKAGES_GPG_KEY_FILE" "" }}'

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive
  # syft doesn't look inside a .deb or an .rpm; each package holds the
  # binary from its architecture's archive, so that's what's scanned.
  - id: packages
    artifacts: package
    args:
      - "{{ .ProjectName }}_{{ .Version }}_linux_{{ .Arch }}.tar.gz"
      - "--source-name=${artifact}"
      - "--output=spdx-json=${document}"
      - "--enrich=all"

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]
    artifacts: checksum

# Keyless, as for checksums.txt: the signature names the release workflow
# and is stored in the registry beside the image.
docker_signs:
  - cmd: cosign
    args: ["sign", "${artifact}@${digest}", "--yes"]

dockers_v2:
  - images:
      - ghcr.io/conn3xorg/conn3x-ui
    tags:
      - "v{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    dockerfile: release.Containerfile
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: conn3x-ui
      org.opencontainers.image.description: A web UI for Conn3x. Plan from the browser, apply exactly that plan.
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.licenses: MPL-2.0

homebrew_casks:
  - name: conn3x-ui
    repository:
      owner: conn3xorg
      name: homebrew-tap
      # Token fields only expand .Env, not template functions.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://conn3x.org
    description: A web UI for Conn3x. Plan from the browser, apply exactly that plan.
    license: MPL-2.0
    hooks:
      post:
        # The binary is not notarised by Apple; let Gatekeeper run it.
        install_steps: |
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/conn3x-ui"]

scoops:
  - name: conn3x-ui
    repository:
      owner: conn3xorg
      name: scoop-bucket
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://conn3x.org
    description: A web UI for Conn3x. Plan from the browser, apply exactly that plan.
    license: MPL-2.0
    skip_upload: auto

changelog:
  sort: asc
  use: github
  format: "{{ .Message }}"
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: true
  replace_existing_draft: true
  footer: |
    Verify a download:

    ```sh
    cosign verify-blob \
      --certificate-identity 'https://github.com/conn3xorg/conn3x-ui/.github/workflows/release.yml@refs/heads/main' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      --bundle checksums.txt.sigstore.json checksums.txt
    sha256sum --check --ignore-missing checksums.txt
    ```

    Verify the container image:

    ```sh
    cosign verify ghcr.io/conn3xorg/conn3x-ui:v{{ .Version }} \
      --certificate-identity 'https://github.com/conn3xorg/conn3x-ui/.github/workflows/release.yml@refs/heads/main' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    ```
