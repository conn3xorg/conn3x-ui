name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      # shortcut: TestRealConn3x skips here (no CONN3X_BIN); point it at a
      # released conn3x once one carries the conn3x step object.
      # -timeout fails a hung test with every goroutine's stack, well before
      # the runner's own limit cancels the job and its log is lost.
      - run: go test -race -timeout 9m ./...
